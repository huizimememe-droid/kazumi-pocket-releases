name: Probe anonymous HD NBA sources 20349
on:
  push:
    paths:
      - probe/nba-hd-20349.py
permissions:
  contents: read
jobs:
  probe:
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Ensure video probe tools
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Anonymous playback, dimensions, strict decoding and seeking
        run: python3 probe/nba-hd-20349.py
