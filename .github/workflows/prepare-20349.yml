name: Prepare fusion release 20349
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-20349.yml', 'releases/pocket-20349-notes.md']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'huizimememe-droid/kazumi-pocket-releases'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view pocket-20349 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view pocket-20349 --repo "$GITHUB_REPOSITORY" --json url,isDraft
          else
            gh release create pocket-20349 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "融合版 2.4.2 · NBA 高清全场" --notes-file releases/pocket-20349-notes.md
          fi
