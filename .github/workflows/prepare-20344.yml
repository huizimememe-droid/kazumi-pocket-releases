name: Prepare cinema super resolution 20344
on:
  push:
    paths:
      - .github/workflows/prepare-20344.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Create draft and temporary artifact transport branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view pocket-20344 >/dev/null 2>&1; then
            gh release create pocket-20344 --draft --title "Kazumi 融合版 2.4.2 · 20344 影视超分" --notes "在已发布2.4.2融合版上增加可选影视MPV/Anime4K超分入口，保留原播放器回退。未进行安卓真机GPU验证。"
          fi
          if ! gh api "repos/$GH_REPO/git/ref/heads/transport/pocket-20344" >/dev/null 2>&1; then
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/heads/transport/pocket-20344 -f sha="$HEAD_SHA" >/dev/null
          fi
